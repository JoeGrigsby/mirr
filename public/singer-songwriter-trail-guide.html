  --text-guide-number: 15px; /* FIELD GUIDE № 001 */
  --text-tagline: 13px;      /* A STORY FIELD GUIDE PROJECT */
  --text-body-lg: 18px;
  --text-body: 15px;
  --text-small: 13px;
  --text-micro: 11px;

  /* Line-height */
  --lh-display: 1.0; /* @kind other */
  --lh-body: 1.55; /* @kind other */
  --lh-tight: 1.2; /* @kind other */

  /* Letter-spacing (tracking) */
  --tracking-display: 0.005em;
  --tracking-eyebrow: 0.16em;
  --tracking-label: 0.10em;
  --tracking-tagline: 0.14em;

  /* Weights */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-black: 900;
}

/* ---------- Story Field Guide — Spacing, radius, layout tokens ---------- */
:root{
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  --panel-padding: var(--space-5);
  --rail-width: 340px;
  --container-max: 1440px;
}

/* ---------- Story Field Guide — Shadow, blur, border & motion tokens ---------- */
:root{
  /* Panels float over dark starfields / photos / architectural renders — a soft
     outer glow + thin hairline border does the separating, never a hard drop shadow. */
  --shadow-panel: 0 12px 40px rgba(0,0,0,0.45);
  --shadow-panel-soft: 0 4px 18px rgba(0,0,0,0.28);
  --shadow-focus: 0 0 0 3px rgba(232,168,62,0.35);

  --border-hairline: 1px solid rgba(255,255,255,0.12); /* @kind other */
  --border-hairline-soft: 1px solid rgba(255,255,255,0.08); /* @kind other */

  --blur-panel: blur(18px); /* @kind other */
  --backdrop-panel: rgba(10,10,14,0.72);

  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */
  --duration-fast: 120ms; /* @kind other */
  --duration-base: 200ms; /* @kind other */
  --duration-slow: 360ms; /* @kind other */
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
:root{
  --surface-page: var(--sfg-parchment);
  --surface-panel: var(--ma-panel);
  --surface-panel-border: var(--ma-panel-border);
  --text-primary: var(--ma-ink);
  --text-secondary: var(--ma-ink-soft);
  --text-muted: var(--sfg-gray-500);
  --link-color: var(--ss-coral-deep);
  --link-hover: color-mix(in oklch, var(--ss-coral-deep) 78%, black);
  --ss-accent: var(--ss-coral-deep);
  --ss-ink: oklch(0.36 0.09 258);
  --ss-coral: oklch(0.66 0.17 32);
  --ss-coral-deep: oklch(0.55 0.17 32);
  --ss-gold: #E8AC4F;
  --ss-paper: var(--sfg-parchment-soft);
}
body{background:var(--surface-page)}
a{color:var(--link-color)}
a:hover{color:var(--link-hover)}
#root{position:relative;width:100vw;height:100vh}
#viewport{position:absolute;inset:0;background:var(--ss-paper);overflow:hidden;cursor:grab}
#viewport:active{cursor:grabbing}
#diagram{position:absolute;top:0;left:0;width:2350px;height:1650px;transform-origin:0 0}
#diagram > svg{position:absolute;top:0;left:0;width:2350px;height:1650px;overflow:visible}
.node{cursor:pointer}
.badge-layer{position:absolute;top:0;left:0;width:2350px;height:1650px;pointer-events:none}
.badge-card{position:absolute;width:122px;cursor:pointer;pointer-events:auto;background:var(--ss-paper);border:2px solid var(--ss-ink);border-radius:6px;overflow:hidden;box-shadow:0 5px 12px -3px color-mix(in oklch, var(--ss-ink) 40%, transparent)}
.badge-card .venue-logo{display:block;width:100%;height:60px}
.badge-card.stamp-card{width:122px;height:83px;border:0;border-radius:0;background:transparent;box-shadow:0 4px 11px color-mix(in oklch,var(--ss-ink) 23%,transparent)}
.stamp-art{display:block;width:122px;height:83px}
.badge-caption{height:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--font-display);font-size:11px;letter-spacing:0.03em;color:var(--ss-paper);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:13px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}
.chrome-col{position:absolute;left:28px;top:20px;bottom:auto;z-index:680;width:380px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 100px)}
.masthead-card{order:-1;background:var(--ss-paper);border:2px solid var(--ss-ink);border-radius:10px;padding:13px 15px 15px;box-shadow:5px 5px 0 color-mix(in oklch,var(--ss-ink) 17%,transparent)}
.trail-logo{display:block;width:100%;height:auto;overflow:visible}

.layer-card{order:0;display:grid;gap:2px;padding:8px 12px;background:var(--ss-paper);border:2px solid var(--ss-ink);border-radius:9px;box-shadow:3px 3px 0 color-mix(in oklch,var(--ss-ink) 15%,transparent)}
.layer-toggle{position:relative;display:flex;align-items:center;gap:10px;padding:6px 2px;cursor:pointer;font:700 13px var(--font-sans);color:var(--ss-ink)}
.layer-toggle + .layer-toggle{border-top:1px solid color-mix(in oklch,var(--ss-ink) 18%,transparent)}
.layer-toggle input{position:absolute;opacity:0;width:1px;height:1px}
.layer-label{flex:1;display:flex;align-items:baseline;gap:7px}
.layer-label small{font-weight:600;font-size:11px;color:var(--text-secondary)}
.layer-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ss-ink);flex:none}
.layer-dot-venues{background:var(--ss-coral)}
.layer-dot-hometowns{background:var(--ss-paper);border-style:dashed}
.layer-switch{position:relative;flex:none;width:38px;height:22px;border-radius:11px;border:2px solid var(--ss-ink);background:color-mix(in oklch,var(--ss-ink) 12%,var(--ss-paper));transition:background .2s}
.layer-switch:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ss-ink);transition:transform .2s}
.layer-toggle.on .layer-switch{background:var(--ss-coral)}
.layer-toggle.on .layer-switch:after{transform:translateX(16px);background:var(--ss-paper)}
.layer-toggle input:focus-visible ~ .layer-switch{outline:2px solid var(--ss-coral-deep);outline-offset:2px}
.filter-area{order:1}
.reveal-done .reveal-draw,.reveal-done .reveal-pop,.reveal-done .reveal-fade,.reveal-done .reveal-rise{animation:none;stroke-dashoffset:0}
.home-link{display:inline-block;margin:0 0 9px 3px;font:700 12px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ss-coral-deep);text-decoration:none}.home-link:hover{color:var(--ss-ink);text-decoration:underline}.instructions{margin:0;padding:9px 5px 0;border-top:1px solid color-mix(in oklch,var(--ss-ink) 30%,transparent);font-family:var(--font-sans);font-size:12px;color:var(--text-secondary);letter-spacing:0.01em;line-height:1.35}
.filter-area{position:relative}
.filter-toolbar{display:flex;align-items:stretch;gap:7px}
.filter-trigger,.filter-reset{border:2px solid var(--ss-ink);border-radius:7px;background:var(--ss-paper);color:var(--ss-ink);font-family:var(--font-sans);font-size:12px;font-weight:700;cursor:pointer}
.filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;min-width:0;padding:10px 11px;text-align:left;box-shadow:3px 3px 0 color-mix(in oklch,var(--ss-ink) 15%,transparent)}
.filter-trigger[aria-expanded="true"]{background:var(--ss-ink);color:var(--ss-paper)}
.filter-trigger .filter-summary{font-size:10px;font-weight:700;white-space:nowrap;opacity:.8}
.filter-reset{padding:0 10px;color:var(--ss-coral-deep)}
.filter-popover{position:absolute;top:calc(100% + 8px);bottom:auto;left:0;width:100%;max-height:min(44vh,340px);display:flex;flex-direction:column;background:var(--ss-paper);border:2px solid var(--ss-ink);border-radius:9px;box-shadow:6px 6px 0 color-mix(in oklch,var(--ss-ink) 18%,transparent);overflow:hidden}

.filter-search{margin:10px 12px 3px;width:calc(100% - 24px);padding:8px 10px;border:1px solid var(--ss-ink);border-radius:5px;background:#fff;color:var(--ss-ink);font:13px var(--font-sans)}
.filter-options{overflow:auto;padding:7px 12px 12px;display:grid;gap:3px}
.filter-option{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:5px;font:13px var(--font-sans);color:var(--ss-ink);cursor:pointer}

.review-label{font:700 11px var(--font-sans);letter-spacing:.09em;text-transform:uppercase}

.review-score .stars{color:var(--ss-coral-deep);letter-spacing:.04em;font-size:15px}
.review-score .count{font-size:12px;color:var(--text-secondary)}
.review-card a{font-weight:700;font-size:12px}
.sound-text{margin-top:6px;font:13px/1.5 var(--font-sans);color:var(--ss-ink)}.review-date{margin-top:6px;font-size:11px;color:var(--text-secondary)}
.panel-wrap{position:absolute;top:28px;right:28px;z-index:700;width:min(370px,calc(100vw - 24px));max-height:calc(100vh - 56px);overflow-y:auto;border:2px solid var(--ss-ink);border-radius:var(--radius-md);box-shadow:0 12px 28px -8px color-mix(in oklch, var(--ss-ink) 45%, transparent);background:var(--ss-paper)}
.panel-wrap > *{border:none !important}
.panel-wrap > :not(.panel-drag){width:100% !important}
.panel-drag{height:30px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--ss-ink);color:var(--ss-paper);font:700 10px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;cursor:grab;touch-action:none;user-select:none}

.photo-credit{font:11px/1.45 var(--font-sans);padding-top:9px;margin-top:3px;border-top:1px solid color-mix(in oklch,var(--ss-ink) 25%,transparent);color:var(--text-secondary)}
.landmark{pointer-events:none;opacity:.82}
