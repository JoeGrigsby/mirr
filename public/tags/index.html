<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Object register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #e4e9df;
  --card: #f1f4ec;
  --ink: #1d2a21;
  --muted: #59665d;
  --line: #b6c0b1;
  --accent: #2c5a5f;
  --accent-ink: #f1f4ec;
  --stamp: #8a4b1c;
  --danger: #8c2f2f;
  --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131a15;
    --card: #1b241e;
    --ink: #e2e8dd;
    --muted: #9ca89f;
    --line: #36443b;
    --accent: #86b9b4;
    --accent-ink: #10201f;
    --stamp: #d9a066;
    --danger: #e08a8a;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 20px 64px; }
header.bar {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 28px;
}
.brand { font: 400 18px/1.2 var(--serif); color: var(--ink); text-decoration: none; }
.who { font-size: 14px; color: var(--muted); text-align: right; }
.who button { margin-left: 8px; }

h1 { font: 400 clamp(34px, 9vw, 52px)/1.08 var(--serif); margin: 0 0 10px; letter-spacing: -0.01em; }
h2 { font: 400 24px/1.25 var(--serif); margin: 0 0 4px; }
p { margin: 0 0 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* The one bold element: the role stamp, like an ink stamp on a specimen label. */
.stamp {
  display: inline-block;
  font: 700 15px/1 var(--serif);
  letter-spacing: 0.04em;
  color: var(--stamp);
  border: 2px solid currentColor;
  outline: 1px solid currentColor;
  outline-offset: 3px;
  padding: 9px 14px 8px;
  transform: rotate(-2.5deg);
  margin: 6px 0 22px 4px;
  animation: press 380ms cubic-bezier(.2,.9,.3,1.3) both;
}
@keyframes press { from { transform: rotate(-2.5deg) scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }

.proof { font-size: 14px; color: var(--muted); margin: -8px 0 18px; }
.proof.ok { color: var(--accent); font-weight: 600; }
.byline { font: italic 400 18px/1.4 var(--serif); color: var(--muted); margin-bottom: 22px; }
.story { font: 400 18px/1.7 var(--serif); white-space: pre-wrap; }
.facts { margin: 22px 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.facts dt { color: var(--muted); margin: 0; }
.facts dd { margin: 0; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; margin: 22px 0; font: italic 400 17px/1.6 var(--serif); }
.lost { background: var(--danger); color: var(--card); padding: 10px 14px; font-weight: 600; margin-bottom: 20px; }

section.panel {
  background: var(--card); border: 1px solid var(--line);
  padding: 20px; margin-top: 30px;
}
section.panel > .lede { color: var(--muted); font-size: 14px; margin-bottom: 16px; }

label { display: block; font-size: 14px; font-weight: 500; margin: 14px 0 5px; }
input, textarea, select {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); padding: 10px 12px; border-radius: 2px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button {
  font: 600 15px/1 var(--sans); cursor: pointer; border-radius: 2px;
  padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
button.quiet { background: transparent; color: var(--accent); }
button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 500; }
button:disabled { opacity: .55; cursor: wait; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.msg { font-size: 14px; margin-top: 10px; min-height: 1.2em; }
.msg.err { color: var(--danger); }
.code {
  display: block; width: 100%; overflow-x: auto; white-space: nowrap;
  font: 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
  background: var(--paper); border: 1px dashed var(--line); padding: 10px 12px; margin-top: 6px;
}
ol.history { padding-left: 1.3em; margin: 6px 0 0; }
ol.history li { padding: 4px 0; }
ul.items { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
ul.items li { border-bottom: 1px solid var(--line); }
ul.items a { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; color: var(--ink); text-decoration: none; }
ul.items a:hover .t { text-decoration: underline; }
ul.items .t { font: 400 20px/1.3 var(--serif); }
ul.items .r { font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 18px; margin-bottom: 6px; }
.tabs button[aria-pressed="true"] { text-decoration: none; color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="/tags/">Object register</a>
    <div class="who" id="who"></div>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
</div>

<script>
const $app = document.getElementById("app");
const $who = document.getElementById("who");
const params = new URLSearchParams(location.search);
let me = null;

// --- tiny DOM helper: h("p", {class:"x"}, "text", childNode) ---
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(path, data) {
  const res = await fetch("/api" + path, data === undefined
    ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
  const out = await res.json().catch(() => ({ error: "The server sent an unreadable reply." }));
  if (!res.ok) throw new Error(out.error || "Request failed.");
  return out;
}

const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : "";
const show = (...nodes) => { $app.replaceChildren(...nodes.flat().filter((n) => n != null && n !== false)); window.scrollTo(0, 0); };

function busy(btn, msgEl, fn) {
  return async (e) => {
    e?.preventDefault();
    btn.disabled = true; if (msgEl) { msgEl.textContent = ""; msgEl.className = "msg"; }
    try { await fn(); }
    catch (err) { if (msgEl) { msgEl.textContent = err.message; msgEl.className = "msg err"; } }
    finally { btn.disabled = false; }
  };
}

function renderWho() {
  $who.replaceChildren();
  if (me) {
    $who.append(me.name, h("button", { class: "link", onclick: async () => { await api("/logout", {}); location.href = "/tags/"; } }, "Sign out"));
  }
}

// ---------- sign in / create account ----------
function authPanel(heading, after) {
  let mode = "in";
  const msg = h("div", { class: "msg", role: "status" });
  const name = h("input", { id: "f-name", autocomplete: "name" });
  const email = h("input", { id: "f-email", type: "email", autocomplete: "email" });
  const pass = h("input", { id: "f-pass", type: "password", autocomplete: "current-password" });
  const invite = h("input", { id: "f-invite", autocomplete: "off" });
  const go = h("button", { type: "submit" }, "Sign in");
  const tabIn = h("button", { type: "button", class: "link", "aria-pressed": "true" }, "Sign in");
  const tabUp = h("button", { type: "button", class: "link", "aria-pressed": "false" }, "Create account");
  const upFields = h("div", { hidden: true },
    h("label", { for: "f-name" }, "Your name"), name,
    me === null && window.__inviteRequired ? [h("label", { for: "f-invite" }, "Invite code"), invite] : null);

  const setMode = (m) => {
    mode = m;
    tabIn.setAttribute("aria-pressed", m === "in"); tabUp.setAttribute("aria-pressed", m === "up");
    upFields.hidden = m === "in";
    go.textContent = m === "in" ? "Sign in" : "Create account";
    pass.autocomplete = m === "in" ? "current-password" : "new-password";
  };
  tabIn.onclick = () => setMode("in");
  tabUp.onclick = () => setMode("up");

  const form = h("form", {},
    h("div", { class: "tabs" }, tabIn, tabUp),
    upFields,
    h("label", { for: "f-email" }, "Email"), email,
    h("label", { for: "f-pass" }, "Password"), pass,
    h("div", { class: "row" }, go), msg);
  form.addEventListener("submit", busy(go, msg, async () => {
    if (mode === "in") await api("/login", { email: email.value, password: pass.value });
    else await api("/signup", { name: name.value, email: email.value, password: pass.value, invite: invite.value });
    await loadMe();
    after();
  }));
  return h("section", { class: "panel" }, h("h2", {}, heading), form);
}

// ---------- item page ----------
function stampText(r) {
  if (r.creator && r.owner) return "You made and own this";
  if (r.owner) return "You own this";
  if (r.creator) return "You made this";
  return "Viewing";
}

function field(id, labelText, value, multiline) {
  const el = multiline ? h("textarea", { id }) : h("input", { id });
  el.value = value || "";
  return [h("label", { for: id }, labelText), el];
}

async function showItem(id) {
  let item;
  try { item = (await api("/item?id=" + encodeURIComponent(id))).item; }
  catch (err) { return show(h("h1", {}, "Item not found"), h("p", {}, err.message)); }
  document.title = item.title;
  const r = item.roles;

  const facts = h("dl", { class: "facts" },
    item.materials ? h("div", {}, h("dt", {}, "Materials"), h("dd", {}, item.materials)) : null,
    h("div", {}, h("dt", {}, "Owners so far"), h("dd", {}, String(item.ownerCount))),
    r.owner && item.owner.since ? h("div", {}, h("dt", {}, "Yours since"), h("dd", {}, fmtDate(item.owner.since))) : null,
    r.creator && !r.owner && item.ownerName ? h("div", {}, h("dt", {}, "Current owner"), h("dd", {}, item.ownerName)) : null);

  const proof = item.tap === "verified"
    ? h("p", { class: "proof ok" }, "Verified tap from this object’s original tag")
    : item.tap === "tapped" ? h("p", { class: "proof" }, "Opened from this object’s tag") : null;

  const by = [`Made by ${item.creatorName}`, item.madeOn ? ` in ${item.madeOn}` : ""].join("");

  const nodes = [
    h("div", { class: "stamp" }, stampText(r)),
    proof,
    item.status === "lost" ? h("div", { class: "lost" }, "The owner has reported this object as lost or stolen.") : null,
    h("h1", {}, item.title),
    h("p", { class: "byline" }, by),
    item.story ? h("p", { class: "story" }, item.story)
      : h("p", { class: "muted" }, r.creator ? "Add the story of how you made this below." : "The maker hasn’t added a story yet."),
    facts,
    item.publicNote ? h("blockquote", { class: "note" }, item.publicNote, h("div", { class: "small muted" }, "From the owner")) : null,
  ];

  if (r.owner) nodes.push(ownerPanel(item));
  if (r.creator) nodes.push(creatorPanel(item));
  if (r.creator || r.owner) nodes.push(tagPanel(item));
  if (!item.signedIn) {
    nodes.push(h("p", { class: "small muted", style: "margin-top:32px" },
      "Made or own this piece? ",
      h("button", { class: "link", onclick: () => show(authPanel("Sign in to see your records", () => showItem(id))) }, "Sign in")));
  }
  show(...nodes);
}

function ownerPanel(item) {
  const msg = h("div", { class: "msg", role: "status" });
  const [lNotes, notes] = field("o-notes", "Private notes (only you see these)", item.owner.privateNotes, true);
  const [lBuy, buy] = field("o-buy", "Purchase or appraisal details", item.owner.purchase, true);
  const [lPub, pub] = field("o-pub", "Public note shown to visitors", item.owner.publicNote, true);
  const status = h("select", { id: "o-status" },
    h("option", { value: "ok" }, "With me"),
    h("option", { value: "lost" }, "Lost or stolen"));
  status.value = item.status;
  const save = h("button", {}, "Save my records");
  save.onclick = busy(save, msg, async () => {
    await api("/item/update", { id: item.id, privateNotes: notes.value, purchase: buy.value, publicNote: pub.value, status: status.value });
    msg.textContent = "Saved.";
    if (status.value !== item.status) showItem(item.id);
  });

  // Transfer
  const tmsg = h("div", { class: "msg", role: "status" });
  let transfer;
  if (item.owner.pendingTransfer) {
    const copy = h("button", { class: "quiet" }, "Copy link");
    copy.onclick = async () => { await navigator.clipboard.writeText(item.owner.pendingTransfer.url); tmsg.textContent = "Link copied."; };
    const cancel = h("button", { class: "quiet" }, "Cancel transfer");
    cancel.onclick = busy(cancel, tmsg, async () => { await api("/item/cancel-transfer", { id: item.id }); showItem(item.id); });
    transfer = h("div", {},
      h("p", {}, `Send this link to the new owner. It works once and expires ${fmtDate(item.owner.pendingTransfer.expires)}.`),
      h("code", { class: "code" }, item.owner.pendingTransfer.url),
      h("div", { class: "row" }, copy, cancel), tmsg);
  } else {
    const start = h("button", { class: "quiet" }, "Start a transfer");
    start.onclick = busy(start, tmsg, async () => { await api("/item/transfer", { id: item.id }); showItem(item.id); });
    transfer = h("div", {},
      h("p", { class: "small muted" }, "Selling or giving this piece away? Start a transfer to create a one-time link for the new owner. Your private notes are removed when they accept."),
      h("div", { class: "row" }, start), tmsg);
  }

  return h("section", { class: "panel" },
    h("h2", {}, "Your records"),
    h("p", { class: "lede" }, "Only the current owner sees this section."),
    lNotes, notes, lBuy, buy, lPub, pub,
    h("label", { for: "o-status" }, "Status"), status,
    h("div", { class: "row" }, save), msg,
    h("h2", { style: "margin-top:28px" }, "Transfer ownership"),
    transfer);
}

function creatorPanel(item) {
  const msg = h("div", { class: "msg", role: "status" });
  const [lT, t] = field("c-title", "Title", item.title);
  const [lM, m] = field("c-made", "When you made it (for example, March 2026)", item.madeOn);
  const [lMat, mat] = field("c-mat", "Materials", item.materials);
  const [lS, s] = field("c-story", "The story of this piece", item.story, true);
  s.style.minHeight = "160px";
  const save = h("button", {}, "Save maker’s details");
  save.onclick = busy(save, msg, async () => {
    await api("/item/update", { id: item.id, title: t.value, madeOn: m.value, materials: mat.value, story: s.value });
    showItem(item.id);
  });
  const hist = h("ol", { class: "history" }, item.history.map((x) =>
    h("li", {}, h("strong", {}, x.name), " ", h("span", { class: "muted small" }, `${fmtDate(x.from)} to ${x.to ? fmtDate(x.to) : "now"}`))));
  return h("section", { class: "panel" },
    h("h2", {}, "Maker’s details"),
    h("p", { class: "lede" }, "Only you, as the maker, can edit these. Everyone who taps the tag sees them."),
    lT, t, lM, m, lMat, mat, lS, s,
    h("div", { class: "row" }, save), msg,
    h("h2", { style: "margin-top:28px" }, "Ownership history"),
    hist);
}

function tagPanel(item) {
  if (item.tag.mode === "sun") {
    return h("section", { class: "panel" },
      h("h2", {}, "Tag"),
      h("p", { class: "small" }, "Secure tag. Each tap creates a new signed link, so copied links don’t work."),
      h("code", { class: "code" }, "UID " + item.tag.uid));
  }
  const msg = h("div", { class: "msg", role: "status" });
  const copy = h("button", { class: "quiet" }, "Copy tag URL");
  copy.onclick = async () => { await navigator.clipboard.writeText(item.tag.url); msg.textContent = "Copied. Paste it into NFC Tools."; };
  return h("section", { class: "panel" },
    h("h2", {}, "Tag"),
    h("p", { class: "small" }, "In NFC Tools, choose Write, then Add a record, then URL / URI. Paste this URL and write it to the sticker."),
    h("code", { class: "code" }, item.tag.url),
    h("div", { class: "row" }, copy), msg);
}

// ---------- claim (new owner accepting) ----------
async function showClaim(code) {
  let c;
  try { c = (await api("/claim?code=" + encodeURIComponent(code))).claim; }
  catch (err) { return show(h("h1", {}, "Transfer link not valid"), h("p", {}, err.message)); }
  const msg = h("div", { class: "msg", role: "status" });
  const accept = h("button", {}, "Accept ownership");
  accept.onclick = busy(accept, msg, async () => {
    const out = await api("/claim/accept", { code });
    location.href = "/tags/?item=" + out.id;
  });
  const nodes = [
    h("div", { class: "stamp" }, "Transfer"),
    h("h1", {}, c.title),
    h("p", { class: "byline" }, `Made by ${c.creatorName}`),
    h("p", {}, `${c.fromName} is transferring this piece to you. Once you accept, you become its owner and the maker’s story stays with it.`),
    c.needsTap && !c.hasTap ? h("p", { class: "small muted" }, "This piece has a secure tag. Tap it with your phone, then come back to this link to accept.") : null,
  ];
  if (!me) nodes.push(authPanel("Sign in or create an account to accept", () => showClaim(code)));
  else nodes.push(h("div", { class: "row" }, accept), msg);
  show(...nodes);
}

// ---------- register a new secure (SUN) tag ----------
function showRegister() {
  if (!me) return show(h("h1", {}, "New tag"), h("p", {}, "This is a genuine tag that isn’t linked to anything yet. Sign in to link it to a piece you made."),
    authPanel("Sign in to register this tag", showRegister));
  const msg = h("div", { class: "msg", role: "status" });
  const title = h("input", { id: "r-title", placeholder: "Blue glazed vase" });
  const go = h("button", {}, "Link tag to this piece");
  go.onclick = busy(go, msg, async () => {
    const out = await api("/register-sun", { title: title.value });
    location.href = "/tags/?item=" + out.id;
  });
  show(h("h1", {}, "New tag"),
    h("p", {}, "This tag is genuine and not linked to anything yet. You’ll be recorded as the maker and first owner."),
    h("label", { for: "r-title" }, "What is the piece called?"), title,
    h("div", { class: "row" }, go), msg);
}

// ---------- dashboard ----------
async function showHome() {
  const tapMsg = {
    invalid: "That tap couldn’t be verified. The tag may be a copy, or its keys don’t match this site.",
    stale: "That link was already used. Tap the tag again to open a fresh one.",
    unknown: "This tag isn’t linked to any piece.",
  }[params.get("tap")];
  const top = tapMsg ? h("div", { class: "lost", role: "alert" }, tapMsg) : null;

  if (!me) return show(top, h("h1", {}, "Object register"), h("p", { class: "muted" }, "Records for objects with tags."), authPanel("Sign in", showHome));

  const { items } = await api("/items");
  const msg = h("div", { class: "msg", role: "status" });
  const title = h("input", { id: "n-title", placeholder: "Blue glazed vase" });
  const add = h("button", {}, "Add piece");
  add.onclick = busy(add, msg, async () => {
    const out = await api("/items", { title: title.value });
    location.href = "/tags/?item=" + out.id;
  });
  const label = (it) => it.creator && it.owner ? "Made and owned" : it.owner ? "Owned" : "Made";

  show(top,
    h("h1", {}, "Your pieces"),
    items.length
      ? h("ul", { class: "items" }, items.map((it) => h("li", {}, h("a", { href: "/tags/?item=" + it.id }, h("span", { class: "t" }, it.title), h("span", { class: "r" }, label(it))))))
      : h("p", { class: "muted" }, "Nothing here yet. Add a piece you made to get a URL for its tag."),
    h("section", { class: "panel" },
      h("h2", {}, "Add a piece you made"),
      h("p", { class: "lede" }, "You’ll get a URL to write to its tag with NFC Tools."),
      h("label", { for: "n-title" }, "Title"), title,
      h("div", { class: "row" }, add), msg));
}

async function loadMe() {
  const out = await api("/me");
  me = out.user;
  window.__inviteRequired = out.inviteRequired;
  renderWho();
}

(async () => {
  try {
    await loadMe();
    if (params.get("item")) await showItem(params.get("item"));
    else if (params.get("claim")) await showClaim(params.get("claim"));
    else if (params.get("register")) showRegister();
    else await showHome();
  } catch (err) {
    show(h("h1", {}, "Can’t reach the server"), h("p", {}, err.message));
  }
})();
</script>
</body>
</html>
