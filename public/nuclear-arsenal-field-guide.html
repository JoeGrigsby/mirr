      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

%\" stop-color=\"#06111e\"><\u002Fstop>\n          <stop offset=\"52%\" stop-color=\"#082338\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"#05121f\"><\u002Fstop>\n        <\u002FlinearGradient>\n        <radialGradient id=\"globalGlow\" cx=\"50%\" cy=\"46%\" r=\"58%\">\n          <stop offset=\"0%\" stop-color=\"#1b7794\" stop-opacity=\".22\"><\u002Fstop>\n          <stop offset=\"48%\" stop-color=\"#0a3b59\" stop-opacity=\".08\"><\u002Fstop>\n          <stop offset=\"100%\" stop-color=\"#04101c\" stop-opacity=\"0\"><\u002Fstop>\n        <\u002FradialGradient>\n        <pattern id=\"gridPattern\" width=\"80\" height=\"80\" patternUnits=\"userSpaceOnUse\">\n          <path d=\"M 80 0 L 0 0 0 80\" fill=\"none\" stroke=\"#5e9eb3\" stroke-opacity=\".13\" stroke-width=\".7\"><\u002Fpath>\n          <circle cx=\"0\" cy=\"0\" r=\"1.2\" fill=\"#73d5df\" fill-opacity=\".3\"><\u002Fcircle>\n        <\u002Fpattern>\n        <filter id=\"softGlow\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n          <feGaussianBlur stdDeviation=\"4\"><\u002FfeGaussianBlur>\n        <\u002Ffilter>\n      <\u002Fdefs>\n      <rect x=\"0\" y=\"0\" width=\"1600\" height=\"800\" fill=\"url(#waterGradient)\"><\u002Frect>\n      <rect x=\"0\" y=\"0\" width=\"1600\" height=\"800\" fill=\"url(#gridPattern)\" opacity=\".42\"><\u002Frect>\n      <ellipse cx=\"810\" cy=\"390\" rx=\"770\" ry=\"410\" fill=\"url(#globalGlow)\"><\u002Fellipse>\n      <g transform=\"{{ mapTransform }}\">\n        <g transform=\"matrix(1.31 0 0 1 -248 0)\">\n          <path d=\"{{ graticuleD }}\" stroke=\"#3d7890\" stroke-width=\"0.5\" fill=\"none\" opacity=\".34\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n\n          <sc-for list=\"{{ countryPathsList }}\" as=\"c\" hint-placeholder-count=\"0\">\n            <path d=\"{{ c.d }}\" fill=\"{{ c.fill }}\" fill-opacity=\"{{ c.fillOpacity }}\" stroke=\"{{ c.stroke }}\" stroke-opacity=\"{{ c.strokeOpacity }}\" stroke-width=\"{{ c.strokeWidth }}\" vector-effect=\"non-scaling-stroke\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"cursor:{{ c.cursor }};transition:fill-opacity .18s ease,stroke .18s ease;\"><\u002Fpath>\n          <\u002Fsc-for>\n        <\u002Fg>\n\n        <sc-for list=\"{{ riskLinksList }}\" as=\"link\" hint-placeholder-count=\"0\">\n          <path class=\"risk-map-link\" d=\"{{ link.d }}\" stroke-width=\"{{ link.width }}\"><\u002Fpath>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ riskNodesList }}\" as=\"node\" hint-placeholder-count=\"0\">\n          <g class=\"{{ node.className }}\" transform=\"{{ node.transform }}\" sc-camel-on-click=\"{{ node.onClick }}\" style=\"cursor:pointer;\">\n            <circle class=\"risk-node-outer\" cx=\"0\" cy=\"0\" r=\"{{ node.outerR }}\" stroke=\"{{ node.color }}\"><\u002Fcircle>\n            <circle class=\"risk-node-inner\" cx=\"0\" cy=\"0\" r=\"{{ node.innerR }}\" fill=\"{{ node.color }}\" fill-opacity=\".5\"><\u002Fcircle>\n            <foreignObject x=\"{{ node.fx }}\" y=\"{{ node.fy }}\" width=\"{{ node.fw }}\" height=\"{{ node.fh }}\" style=\"overflow:visible;\">\n              <div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"position:relative;width:100%;height:100%;font-family:'IBM Plex Mono',monospace;\">\n                <div style=\"position:absolute;left:50%;top:{{ node.armyTop }}px;transform:translate(-50%,-50%);color:#f2f7f4;font-size:{{ node.armySize }}px;font-weight:700;line-height:1;white-space:nowrap;\">{{ node.armies }}<\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:{{ node.labelTop }}px;transform:translate(-50%,-50%);color:{{ node.color }};font-size:{{ node.labelSize }}px;letter-spacing:.6px;white-space:nowrap;\">{{ node.abbr }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002FforeignObject>\n          <\u002Fg>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ allianceLinesList }}\" as=\"a\" hint-placeholder-count=\"0\">\n          <path d=\"{{ a.d }}\" fill=\"none\" stroke=\"{{ a.color }}\" stroke-width=\"{{ a.width }}\" stroke-dasharray=\"{{ a.dash }}\" opacity=\"{{ a.opacity }}\"><\u002Fpath>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ scenarioArcsList }}\" as=\"a\" hint-placeholder-count=\"0\">\n          <path class=\"scenario-trajectory\" d=\"{{ a.d }}\" stroke=\"{{ a.color }}\" stroke-width=\"{{ a.width }}\" pathLength=\"100\" style=\"animation-delay:{{ a.delay }}s;\"><\u002Fpath>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ scenarioBurstsList }}\" as=\"b\" hint-placeholder-count=\"0\">\n          <circle class=\"scenario-burst scenario-burst-outer\" cx=\"{{ b.cx }}\" cy=\"{{ b.cy }}\" r=\"{{ b.outerR }}\" stroke=\"{{ b.color }}\" stroke-width=\"{{ b.strokeWidth }}\" style=\"animation-delay:{{ b.delay }}s;\"><\u002Fcircle>\n          <circle class=\"scenario-burst scenario-burst-core\" cx=\"{{ b.cx }}\" cy=\"{{ b.cy }}\" r=\"{{ b.innerR }}\" fill=\"{{ b.color }}\" fill-opacity=\".34\" stroke=\"{{ b.color }}\" stroke-width=\"{{ b.strokeWidth }}\" style=\"animation-delay:{{ b.delay }}s;\"><\u002Fcircle>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ blastRingsList }}\" as=\"b\" hint-placeholder-count=\"0\">\n          <circle cx=\"{{ b.cx }}\" cy=\"{{ b.cy }}\" r=\"{{ b.r }}\" fill=\"{{ b.fill }}\" fill-opacity=\"{{ b.fillOpacity }}\" stroke=\"none\"><\u002Fcircle>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ siteMarkersList }}\" as=\"s\" hint-placeholder-count=\"0\">\n          <g transform=\"{{ s.transform }}\" sc-camel-on-click=\"{{ s.onClick }}\" opacity=\"{{ s.opacity }}\" style=\"cursor:pointer;\">\n            <rect x=\"{{ s.x }}\" y=\"{{ s.y }}\" width=\"{{ s.size }}\" height=\"{{ s.size }}\" fill=\"{{ s.fill }}\" stroke=\"#071522\" stroke-width=\".8\"><\u002Frect>\n          <\u002Fg>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ treatyRingsList }}\" as=\"t\" hint-placeholder-count=\"0\">\n          <circle cx=\"{{ t.cx }}\" cy=\"{{ t.cy }}\" r=\"{{ t.r }}\" fill=\"none\" stroke=\"{{ t.color }}\" stroke-width=\"{{ t.strokeWidth }}\" stroke-dasharray=\"3 3\" opacity=\"{{ t.opacity }}\"><\u002Fcircle>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ countryMarkersList }}\" as=\"m\" hint-placeholder-count=\"9\">\n          <g transform=\"{{ m.groupTransform }}\" sc-camel-on-click=\"{{ m.onClick }}\" style=\"cursor:pointer;\">\n            <circle cx=\"0\" cy=\"0\" r=\"{{ m.haloR }}\" fill=\"none\" stroke=\"{{ m.edgeColor }}\" stroke-width=\".8\" stroke-opacity=\".32\" class=\"marker-halo\"><\u002Fcircle>\n            <circle cx=\"0\" cy=\"0\" r=\"{{ m.r }}\" fill=\"{{ m.anchorColor }}\" fill-opacity=\".50\" stroke=\"{{ m.strokeColor }}\" stroke-width=\"{{ m.strokeWidth }}\"><\u002Fcircle>\n            <text x=\"{{ m.labelX }}\" y=\"{{ m.labelY }}\" fill=\"#d6edf1\" font-family=\"'IBM Plex Mono',monospace\" font-size=\"{{ m.labelSize }}\" letter-spacing=\".5\">{{ m.labelText }}<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ doctrineLabelsList }}\" as=\"d\" hint-placeholder-count=\"0\">\n          <foreignObject class=\"doctrine-label\" x=\"{{ d.x }}\" y=\"{{ d.y }}\" width=\"{{ d.width }}\" height=\"{{ d.height }}\" opacity=\"{{ d.opacity }}\" style=\"pointer-events:none;overflow:visible;\">\n            <div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"color:{{ d.color }};font-family:'IBM Plex Mono',monospace;font-size:{{ d.size }}px;font-weight:600;line-height:1.15;letter-spacing:.6px;white-space:nowrap;text-shadow:0 1px 2px #06111e,0 0 3px #06111e;\">{{ d.text }}<\u002Fdiv>\n          <\u002FforeignObject>\n        <\u002Fsc-for>\n\n        <sc-for list=\"{{ allyMarkersList }}\" as=\"ay\" hint-placeholder-count=\"0\">\n          <circle cx=\"{{ ay.cx }}\" cy=\"{{ ay.cy }}\" r=\"{{ ay.r }}\" fill=\"{{ ay.fill }}\" fill-opacity=\"{{ ay.opacity }}\" stroke=\"#081727\" stroke-width=\"1.2\" sc-camel-on-click=\"{{ ay.onClick }}\" style=\"cursor:pointer;\"><\u002Fcircle>\n        <\u002Fsc-for>\n      <\u002Fg>\n    <\u002Fsvg>\n\n    <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"loading-state\">\n        <div class=\"loading-orbit\"><\u002Fdiv>\n        <div class=\"loading-copy\">LOADING ATLAS DATA<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"left-stack\">\n      <div class=\"title-card\">\n        <div class=\"title-topline\"><span class=\"signal-dot\"><\u002Fspan><span>GLOBAL SECURITY SYSTEMS<\u002Fspan><\u002Fdiv>\n        <div class=\"title-wordmark\">NUCLEAR<br><em>ARSENAL<\u002Fem><\u002Fdiv>\n        <div class=\"title-description\">An open-source field guide to nuclear forces, delivery systems, doctrine, and the alliances that shape their reach.<\u002Fdiv>\n        <div class=\"title-meta\"><span>FIELD GUIDE № 005<\u002Fspan><span>DATA CUT · 2025/26<\u002Fspan><\u002Fdiv>\n        <a class=\"field-guides-link\" href=\"./\" target=\"_blank\">← All Field Guides<\u002Fa>\n      <\u002Fdiv>\n\n      <div class=\"control-rail\">\n        <div class=\"rail-intro\">\n          <div class=\"rail-index\">FIELD GUIDE CONTROLS · 01<\u002Fdiv>\n          <div class=\"rail-title\">Read the system in layers<\u002Fdiv>\n          <div class=\"rail-copy\">Select a region, tune the evidence layers, or move through the postwar proliferation timeline.<\u002Fdiv>\n        <\u002Fdiv>\n  \n        <div class=\"control-card glass-panel\">\n          <div sc-camel-on-click=\"{{ toggleRegions }}\" class=\"section-heading\">\n            <div class=\"section-heading-left\"><span class=\"section-number\">01<\u002Fspan><span class=\"section-title\">Jump to region<\u002Fspan><\u002Fdiv>\n            <div class=\"section-chevron\">{{ regionsOpenIcon }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ regionsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"control-body region-control-body\">\n              <div class=\"chip-grid\">\n                <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"6\">\n                  <button class=\"chip-button\" sc-camel-on-click=\"{{ p.onClick }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n  \n        <div class=\"control-card glass-panel\">\n          <div sc-camel-on-click=\"{{ toggleLayers }}\" class=\"section-heading\">\n            <div class=\"section-heading-left\"><span class=\"section-number\">02<\u002Fspan><span class=\"section-title\">Chart layers<\u002Fspan><\u002Fdiv>\n            <div class=\"section-chevron\">{{ layersOpenIcon }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ layersOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"control-body\">\n              <div class=\"range-row\"><div class=\"range-label\"><span>Delivery systems<\u002Fspan><span class=\"range-value\">{{ layerDelivery }}%<\u002Fspan><\u002Fdiv><input class=\"range-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerDelivery }}\" sc-camel-on-change=\"{{ deliveryOnChange }}\"><\u002Fdiv>\n              <div class=\"range-row\"><div class=\"range-label\"><span>Alliance &amp; umbrella lines<\u002Fspan><span class=\"range-value\">{{ layerAlliance }}%<\u002Fspan><\u002Fdiv><input class=\"range-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerAlliance }}\" sc-camel-on-change=\"{{ allianceOnChange }}\"><\u002Fdiv>\n              <div class=\"range-row\"><div class=\"range-label\"><span>Blast &amp; fallout rings<\u002Fspan><span class=\"range-value\">{{ layerBlast }}%<\u002Fspan><\u002Fdiv><input class=\"range-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerBlast }}\" sc-camel-on-change=\"{{ blastOnChange }}\"><\u002Fdiv>\n              <div class=\"range-row\"><div class=\"range-label\"><span>Treaty status rings<\u002Fspan><span class=\"range-value\">{{ layerTreaty }}%<\u002Fspan><\u002Fdiv><input class=\"range-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerTreaty }}\" sc-camel-on-change=\"{{ treatyOnChange }}\"><\u002Fdiv>\n              <div class=\"range-row\"><div class=\"range-label\"><span>Doctrine annotations<\u002Fspan><span class=\"range-value\">{{ layerDoctrine }}%<\u002Fspan><\u002Fdiv><input class=\"range-control\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ layerDoctrine }}\" sc-camel-on-change=\"{{ doctrineOnChange }}\"><\u002Fdiv>\n              <div class=\"data-note\">Blast rings are schematic (≈ {{ blastLegendKm }} tiers) around known military sites — illustrative, not corrected for terrain.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n  \n        <div class=\"control-card glass-panel\">\n          <div sc-camel-on-click=\"{{ toggleTimeline }}\" class=\"section-heading\">\n            <div class=\"section-heading-left\"><span class=\"section-number\">03<\u002Fspan><span class=\"section-title\">Proliferation timeline<\u002Fspan><\u002Fdiv>\n            <div class=\"section-chevron\">{{ timelineOpenIcon }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ timelineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"control-body\">\n              <div class=\"timeline-value\">{{ year }}<\u002Fdiv>\n              <div class=\"timeline-caption\">Showing arsenals tested or declared by this year.<\u002Fdiv>\n              <input class=\"range-control\" type=\"range\" min=\"1945\" max=\"2026\" step=\"1\" value=\"{{ year }}\" sc-camel-on-change=\"{{ yearOnChange }}\">\n              <div class=\"scenario-actions\">\n                <button class=\"scenario-button\" sc-camel-on-click=\"{{ runScenario }}\">{{ scenarioButtonLabel }}<\u002Fbutton>\n                <div class=\"scenario-note\">Illustrative country-level exchange sequence based on arsenals active by the selected year — not a forecast or targeting model.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n  \n        <div class=\"control-card glass-panel\">\n          <div sc-camel-on-click=\"{{ toggleSources }}\" class=\"section-heading\">\n            <div class=\"section-heading-left\"><span class=\"section-number\">04<\u002Fspan><span class=\"section-title\">Sources &amp; methodology<\u002Fspan><\u002Fdiv>\n            <div class=\"section-chevron\">{{ sourcesOpenIcon }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ sourcesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"source-copy control-body\">\n              <p>Stockpile figures: SIPRI Yearbook 2025; FAS Nuclear Notebook (2025). Delivery-site locations: FAS, CSIS Missile Defense Project, 38 North, and public reporting.<\u002Fp>\n              <p>Evidence levels — <span style=\"color:var(--green);\">documented<\u002Fspan>: arms-control-verified or officially acknowledged; <span style=\"color:var(--amber);\">assessed<\u002Fspan>: consistent open-source estimate.<\u002Fp>\n              <p>Basemap: schematic Mercator-style projection via d3 + world-atlas. The known-sites layer intentionally omits city-level strike data.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <button class=\"game-launch-card glass-panel\" sc-camel-on-click=\"{{ openGame }}\">\n          <span class=\"game-launch-left\"><span class=\"section-number\">05<\u002Fspan><span class=\"section-title\">Shall we play a game<\u002Fspan><\u002Fspan>\n          <span class=\"game-launch-arrow\">↗<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stats-card glass-panel\">\n      <div class=\"wopr-identity\">\n        <div class=\"wopr-title\">WOPR<\u002Fdiv>\n        <div class=\"wopr-subtitle\">WAR OPERATION PLAN RESPONSE<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wopr-light-bank\" aria-hidden=\"true\">\n        <sc-for list=\"{{ woprLightsList skFactionName }}<\u002Fdiv>\n          <div class=\"risk-directive\">{{ riskInstruction }}<\u002Fdiv>\n          <div class=\"risk-selection\">\n            <div class=\"risk-selection-label\">SELECTED TERRITORY<\u002Fdiv>\n            <div class=\"risk-selection-name\"><span>{{ riskSelectedName }}<\u002Fspan><strong>{{ riskSelectedArmies }}<\u002Fstrong><\u002Fdiv>\n            <div class=\"risk-selection-owner\" style=\"color:{{ riskSelectedColor }};\">{{ riskSelectedOwner }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"risk-action-grid\">\n            <sc-for list=\"{{ riskActionsList }}\" as=\"action\" hint-placeholder-count=\"2\">\n              <button class=\"{{ action.className }}\" sc-camel-on-click=\"{{ action.onClick }}\">{{ action.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"risk-section-label\"><span>ARMAGEDDON DYNAMICS<\u002Fspan><span>{{ riskCardCount }} CARDS<\u002Fspan><\u002Fdiv>\n          <div class=\"risk-card-list\">\n            <sc-for list=\"{{ riskCardsList }}\" as=\"card\" hint-placeholder-count=\"3\">\n              <button class=\"risk-card\" style=\"--card-color:{{ card.color }};\" sc-camel-on-click=\"{{ card.onClick }}\">\n                <span class=\"risk-card-name\">{{ card.name }}<\u002Fspan><span class=\"risk-card-effect\">{{ card.effect }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"risk-panel risk-intel-panel\">\n          <div class=\"risk-panel-kicker\">GLOBAL FORCE POSTURE<\u002Fdiv>\n          <div class=\"risk-panel-title\">THEATER STATUS<\u002Fdiv>\n          <div class=\"risk-standing-list\">\n            <sc-for list=\"{{ riskStandingsList }}\" as=\"standing\" hint-placeholder-count=\"5\">\n              <div class=\"{{ standing.className }}\">\n                <div class=\"risk-standing-top\"><span class=\"risk-faction-dot\" style=\"color:{{ standing.color }};\"> olling-title\">CALCULATING OUTCOME<\u002Fdiv>\n            <div class=\"wopr-light-bank\" aria-hidden=\"true\">\n              <sc-for list=\"{{ woprLightsList }}\" as=\"light\" hint-placeholder-count=\"144\">\n                <span class=\"{{ light.className }}\" style=\"animation-delay:{{ light.delay }};animation-duration:{{ light.duration }};\"><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ gameOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"game-overlay\">\n        <div class=\"game-console\" role=\"dialog\" aria-modal=\"true\" aria-label=\"WOPR tic-tac-toe game\">\n          <div class=\"game-console-inner\">\n            <div class=\"game-header\">\n              <div>\n                <div class=\"game-wopr-title\">WOPR<\u002Fdiv>\n                <div class=\"game-wopr-subtitle\">GAME SIMULATION TERMINAL / 05<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"game-led-bank\" aria-hidden=\"true\">\n                <sc-for list=\"{{ gameLightsList }}\" as=\"light\" hint-placeholder-count=\"48\">\n                  <span class=\"{{ light.className }}\" style=\"animation-delay:{{ light.delay }};animation-duration:{{ light.duration }};\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button class=\"game-close\" sc-camel-on-click=\"{{ closeGame }}\" aria-label=\"Close game\">×<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"game-rule\"><\u002Fdiv>\n            <div class=\"game-main\">\n              <div class=\"game-terminal\">\n                <div class=\"game-terminal-heading\"><span>WOPR CONNECTION 001<\u002Fspan><span>ONLINE<\u002Fspan><\u002Fdiv>\n                <div class=\"game-greeting\">SHALL WE PLAY A GAME?<\u002Fdiv>\n                <div class=\"game-instruction\">GAME SELECTED: TIC-TAC-TOE<br>INPUT MODE: HUMAN VS. WOPR<\u002Fdiv>\n                <div class=\"game-log\">\n                  <sc-for list=\"{{ gameLogList }}\" as=\"line\" hint-placeholder-count=\"6\">\n                    <div class=\"game-log-line\"><span>&gt;<\u002Fspan>{{ line.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"game-score\">\n                  <div class=\"game-score-item\"><span class=\"game-score-value\">{{ gameHumanScore }}<\u002Fspan><span class=\"game-score-label\">PLAYER<\u002Fspan><\u002Fdiv>\n                  <div class=\"game-score-item\"><span class=\"game-score-value\">{{ gameDrawScore }}<\u002Fspan><span class=\"game-score-label\">DRAW<\u002Fspan><\u002Fdiv>\n                  <div class=\"game-score-item\"><span class=\"game-score-value\">{{ gameWoprScore }}<\u002Fspan><span class=\"game-score-label\">WOPR<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"game-playfield\">\n                <div class=\"game-status\">{{ gameStatus }}<\u002Fdiv>\n                <div class=\"game-board\">\n                  <sc-for list=\"{{ gameCellsList }}\" as=\"cell\" hint-placeholder-count=\"9\">\n                    <button class=\"{{ cell.className }}\" sc-camel-on-click=\"{{ cell.onClick }}\" aria-label=\"{{ cell.ariaLabel }}\">\n                      <span class=\"game-cell-coordinate\">{{ cell.coordinate }}<\u002Fspan><span class=\"game-mark\">{{ cell.value }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"game-player-key\"><span><strong>X<\u002Fstrong> PLAYER<\u002Fspan><span><strong class=\"wopr-key\">O<\u002Fstrong> WOPR<\u002Fspan><\u002Fdiv>\n                <div class=\"game-outcome\">{{ gameOutcome }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"game-actions\">\n              <button class=\"game-action\" sc-camel-on-click=\"{{ declineToPlay }}\">DECLINE TO PLAY<\u002Fbutton>\n              <button class=\"game-action primary\" sc-camel-on-click=\"{{ newGame }}\">NEW GAME<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"detail-card\">\n        <div class=\"detail-bar\"><div class=\"detail-kicker\"><span class=\"signal-dot\"><\u002Fspan>{{ panelCategory }}<\u002Fdiv><button class=\"close-button\" sc-camel-on-click=\"{{ closePanel }}\" aria-label=\"Close detail panel\">×<\u002Fbutton><\u002Fdiv>\n        <h2 class=\"detail-title\">{{ panelTitle }}<\u002Fh2>\n        <div class=\"detail-rule\"><\u002Fdiv>\n        <sc-for list=\"{{ panelParas }}\" as=\"para\" hint-placeholder-count=\"2\">\n          <p class=\"detail-paragraph\">{{ para.text }}<\u002Fp>\n        <\u002Fsc-for>\n        <div class=\"detail-rule\"><\u002Fdiv>\n        <div class=\"meta-list\">\n          <sc-for list=\"{{ panelMeta }}\" as=\"row\" hint-placeholder-count=\"4\">\n            <div class=\"meta-row\"><div class=\"meta-label\">{{ row.label }}<\u002Fdiv><div class=\"meta-value\" style=\"color:{{ row.color }};\">{{ row.value }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"detail-rule\"><\u002Fdiv>\n        <div class=\"detail-sources\"><div class=\"detail-sources-title\">EVIDENCE &amp; SOURCES<\u002Fdiv><sc-for list=\"{{ panelSources }}\" as=\"src\" hint-placeholder-count=\"2\"><div>· {{ src.text }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div class=\"zoom-controls\">\n      <button class=\"zoom-button\" sc-camel-on-click=\"{{ zoomIn }}\" aria-label=\"Zoom in\">+<\u002Fbutton>\n      <button class=\"zoom-button\" sc-camel-on-click=\"{{ zoomOut }}\" aria-label=\"Zoom out\">−<\u002Fbutton>\n      <button class=\"zoom-button\" sc-camel-on-click=\"{{ resetView }}\" aria-label=\"Reset map\">⟲<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"status-bar\">\n      <div class=\"status-group\"><span class=\"status-led\"><\u002Fspan><span>OPEN-SOURCE DATASET<\u002Fspan><span class=\"status-divider\">·<\u002Fspan><span>2025 SOURCES<\u002Fspan><\u002Fdiv>\n      <div class=\"status-center\">DRAG TO PAN · SCROLL OR DOUBLE-CLICK TO ZOOM · CLICK MARKERS FOR DETAIL<\u002Fdiv>\n      <div>FIELD GUIDE № 005 <span class=\"status-divider\">·<\u002Fspan> v0.6 - updated 09/23/26<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;initialYear&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2026,&quot;min&quot;:1945,&quot;max&quot;:2026,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Timeline&quot;},&quot;showDoctrineByDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layers&quot;},&quot;distanceUnits&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Metric&quot;,&quot;Imperial&quot;],&quot;default&quot;:&quot;Metric&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.W = 1600; this.H = 800;\n    this.dragging = false; this.dragLast = null;\n    this.scenarioTimer = null;\n    this.scenarioInterval = null;\n    this.gameTimer = null;\n    this.riskTimer = null;\n    this.svgRef = null; this.projection = null;\n    this.baseMarkers = []; this.baseAllies = []; this.baseSites = []; this.baseAlliances = [];\n    this.buildData();\n    this.state = {\n      loading: true, countryPaths: [], graticuleD: '',\n      zoom: 1, panX: 0, panY: 0, isDragging: false,\n      year: props.initialYear ?? 2026,\n      layers: { delivery: 100, alliance: 66, blast: 0, treaty: 33, doctrine: props.showDoctrineByDefault === fals Russia', lon: 60, lat: 61, matchNames: ['russia', 'russian federation'],\n        warheads: { total: 5580, deployed: 1710, asOf: '2025 est.', confidence: 'Documented (arms-control transparency)' },\n        firstTestYear: 1949, doctrineTag: 'TRIAD \\u00b7 ESCALATION AMBIGUITY',\n        doctrineSummary: '2023 doctrine revisions broadened stated conditions for use; analysts debate how literally to read the shift.',\n        treaty: { label: 'NPT weapon state \\u00b7 suspended New START participation (2023)', color: '#4c9a6a' },\n        body: [\n          'The world\\u2019s largest declared stockpile, built on a Soviet-era logic of redundancy: mobile and silo-based ICBMs, Northern and Pacific Fleet boomers, and a long-range aviation arm still flying airframes older than most of its pilots.',\n          'Moscow suspended its last data exchanges under New START in 2023, thinning the transparency that once made this arsenal one of the best-documented in the world.'\n        ],\n        sources: ['SIPRI Yearbook 2025', 'FAS Nuclear Notebook, Russia (2025)'] },\n      { id: 'cn', name: 'China', lon: 105, lat: 35, matchNames: ['china'],\n        warheads: { total: 600, deployed: 24, asOf: '2025 est.', confidence: 'Assessed (satellite + DoD estimate)' },\n        firstTestYear: 1964, doctrineTag: 'NO FIRST USE (DECLARED)',\n        doctrineSummary: 'Long-declared minimal deterrent is expanding fast; new silo fields suggest a move toward a larger, more survivable force.',\n        treaty: { label: 'NPT weapon state \\u00b7 outside all bilateral arms-control limits', color: '#4c9a6a' },\n        body: [\n          'For fifty years this was the smallest of the five NPT-recognized arsenals, built around a doctrine of minimum deterrence. Commercial satellite imagery from 2021 changed that story overnight, revealing three new silo fields under construction in the Gobi and Xinjiang deserts.',\n          'The Pentagon now projects the stockpile could exceed 1,000 warheads by 2030 \
